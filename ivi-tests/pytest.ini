[pytest]
# tests/ = 기기 E2E (기본), unit/ = 기기 없이 프레임워크 자체 검증 (`pytest unit`)
testpaths = tests
pythonpath = .
addopts = -v -rA -p no:cacheprovider
markers =
    smoke: 빌드마다 도는 최소 확인 (앱 실행·화면 이동·데이터 소스)
    sanity: 주요 기능 E2E (차량 신호 ↔ UI, 주행 중 제한)
    regression: 경계 값·부가 기능까지 전체 회귀
    aaos: AAOS(CarService·VHAL)에서만 의미 있는 테스트. Mock 기기에서는 건너뛴다
    spike: 1단계 기술 검증 (AAOS 기본 SystemUI 대상)
    quarantined: 격리 목록(quarantine.txt)에 있는 테스트. 자동으로 붙는다
