[pytest]
# tests/ = 기기 E2E (기본), unit/ = 기기 없이 프레임워크 자체 검증 (`pytest unit`)
testpaths = tests
pythonpath = .
addopts = -v -rA -p no:cacheprovider
# 테스트 하나(준비·정리 포함)의 시간 제한. 기기가 멈추면 실행 전체가 끝없이 기다리던 것을 막는다
# (6단계: 에뮬레이터가 응답을 멈춰 3회차가 14분 넘게 멈춰 있었다). Windows 는 signal 이 없어 thread 방식
timeout = 180
timeout_method = thread
markers =
    smoke: 빌드마다 도는 최소 확인 (앱 실행·화면 이동·데이터 소스)
    sanity: 주요 기능 E2E (차량 신호 ↔ UI, 주행 중 제한)
    regression: 경계 값·부가 기능까지 전체 회귀
    aaos: AAOS(CarService·VHAL)에서만 의미 있는 테스트. Mock 기기에서는 건너뛴다
    tablet: 태블릿(Mock)에서만 의미 있는 테스트. AAOS 에서는 건너뛴다
    spike: 1단계 기술 검증 (AAOS 기본 SystemUI 대상)
    quarantined: 격리 목록(quarantine.txt)에 있는 테스트. 자동으로 붙는다
    power: 기기 전원을 껐다 켜는 테스트. Appium 세션이 끊기므로 맨 끝에 돈다
    req(*ids): 이 테스트가 확인하는 요구사항 ID (docs/requirements.md, tools/trace_report.py)
